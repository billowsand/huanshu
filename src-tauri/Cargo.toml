[package]
name = "auto-slidev-studio"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "将 Markdown 文档自动转化为精美的 Slidev 演示文稿"
license = "MIT"
authors = ["幻述 Authors"]
repository = "https://github.com/billowsand/huanshu"
homepage = "https://github.com/billowsand/huanshu"
readme = "README.md"
keywords = ["slidev", "markdown", "presentation", "ai", "generator"]
categories = ["text-processing", "command-line-utilities", "graphics"]

[lib]
name = "auto_slidev_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
# Without it `tauri` compiles in dev mode and the app loads devUrl (http://localhost:5173)
# instead of the bundled frontend, which shows ERR_CONNECTION_REFUSED at runtime.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
anyhow = "1.0"
regex = "1.11"
jieba-rs = "0.7.4"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3"
parking_lot = "0.12"
zip = "2"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_DirectWrite"] }
