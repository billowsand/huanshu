[package]
name = "slide-typst"
version = "0.1.0"
edition = "2021"
description = "Native Typst PDF export for Auto-Slidev slide blueprints"
publish = false
build = "build.rs"

[dependencies]
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Same decoders Typst uses, to validate images before they can fail a compile;
# `bmp` is extra because the media library accepts BMP and Typst does not.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
usvg = { version = "0.47", default-features = false }

[dev-dependencies]
base64 = "0.22"
typst-render = "0.15.1"
