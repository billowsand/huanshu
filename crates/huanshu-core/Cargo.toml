[package]
name = "huanshu-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
description = "幻述核心库：数据库、生成流水线、导入导出与 PDF/缩略图渲染，与界面框架无关"
license = "MIT"
authors = ["幻述 Authors"]
repository = "https://github.com/billowsand/huanshu"

[lib]
name = "huanshu_core"
path = "src/lib.rs"

[dev-dependencies]
futures-util = "0.3"
# 只在单测里用来把 PNG 解码，与 `render_pixels` 的原始像素逐点比对。
image = "0.25"

[build-dependencies]
# 无：build.rs 只用 std，把 carbon 图标拷进 OUT_DIR

[dependencies]
slide-typst = { path = "../slide-typst" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
anyhow = "1.0"
regex = "1.11"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
bincode = "1.3"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zip = "2"

# 非 Windows 平台枚举系统字体（`fonts.rs`）；与 typst-kit 用的是同一个 fontdb。
[target.'cfg(not(windows))'.dependencies]
fontdb = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_DirectWrite"] }
