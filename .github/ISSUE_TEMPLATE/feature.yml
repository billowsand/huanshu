name: Feature
description: 提出一个新功能建议
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 这个功能解决什么问题？
      description: 描述你的使用场景或痛点
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: 建议的解决方案
      description: 描述你希望幻述如何实现这个功能
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过其他方案吗？
