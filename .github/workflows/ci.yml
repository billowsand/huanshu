name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Prefer ayatana appindicator; libappindicator3-dev conflicts with it on Ubuntu 24.04.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        # Required so build.rs can embed @iconify-json/carbon icons.json
        run: bun install

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Clippy
        # Prefer green CI while we clean up historical lints; correctness still checked by build/test.
        run: cargo clippy --locked --all-targets
        working-directory: src-tauri

      - name: Build
        run: cargo build --locked --all-targets
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked --all-targets
        working-directory: src-tauri

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run build
