name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Only the native (GPUI) build is published, for Windows and macOS.
# The Tauri build and the frontend dist are no longer released.
jobs:
  native-windows:
    name: native (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The build is pure Rust, so the script is invoked exactly the way it is locally.
      # It must stay ASCII-only.
      - name: Package the native (GPUI) build
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-native.ps1

      # This job creates the GitHub release; the macOS job (see `needs`) appends to it.
      # Release notes come from a committed file: action-gh-release reads it as UTF-8,
      # while inline Chinese in a .ps1 would be read as ANSI by Windows PowerShell.
      - name: Create the release and upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 幻述 ${{ github.ref_name }}
          body_path: .github/release-notes.md
          draft: false
          prerelease: false
          files: |
            dist-package/huanshu-native_windows_x64.exe
            dist-package/HuanshuNative_*_x64-setup.exe

  native-macos:
    name: native (macos)
    runs-on: macos-14
    # The Windows job creates the release; serializing keeps the two jobs from racing
    # each other into a duplicate-release conflict.
    needs: native-windows
    steps:
      - uses: actions/checkout@v4

      # No bun here on purpose: the build is pure Rust and the Carbon icon set is vendored
      # in assets/carbon, so no frontend install is needed on any platform.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Universal (arm64 + x86_64) .app, ad-hoc signed unless the signing secrets are set.
      # To ship a Developer ID signed + notarized DMG, import the certificate into a temporary
      # keychain and set HUANSHU_SIGN_IDENTITY / HUANSHU_NOTARY_PROFILE before this step.
      - name: Package the native (GPUI) build
        run: scripts/package-native-macos.sh --universal

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist-package/HuanshuNative_*_macos_universal.dmg
            dist-package/huanshu-native_macos_universal.zip
