name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Prefer ayatana appindicator; libappindicator3-dev conflicts with it on Ubuntu 24.04.
          # fuse/appimagetool deps for AppImage bundling
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        # Needed for build.rs icon embedding and beforeBuildCommand
        run: bun install

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Leave projectPath at repo root so beforeBuildCommand (`bun run build`)
          # finds package.json; tauri-action discovers src-tauri/tauri.conf.json.
          tagName: ${{ github.ref_name }}
          releaseName: "幻述 ${{ github.ref_name }}"
          releaseBody: |
            ## 下载

            - **Windows**: 安装包 `幻述_*_x64-setup.exe`（NSIS）
            - **Linux**: `*.AppImage` 或 `*.deb`

            查看 [CHANGELOG](https://github.com/billowsand/huanshu/blob/master/CHANGELOG.md) 了解详细更新内容。
          # Publish as a real (non-draft) release so downloads are public.
          releaseDraft: false
          prerelease: false
          # Also upload plain binaries as a fallback for portable use.
          uploadPlainBinary: true

  frontend-release:
    name: frontend (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build
        run: bun install && bun run build
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: dist-studio
          path: src-tauri/dist-studio/
