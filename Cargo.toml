[workspace]
members = [
    "crates/huanshu-core",
    "crates/slide-typst",
    "apps/huanshu-native",
]
resolver = "2"

# Dependencies (Typst, its rasterizer, GPUI…) are optimized even in dev builds. Every slide on
# screen is a Typst raster now, and unoptimized Typst made the native dev loop slow enough to
# wait seconds per page. Workspace crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
